<style>
/* Layout: one phone-first column with a bottom tab bar; wider screens get a centred column. */
:root{
  --bg:#000000;        /* black ground */
  --surface:#111111;   /* cards */
  --ink:#F5F5F5;       /* text */
  --muted:#9E9E9E;     /* secondary text */
  --line:#2A2A2A;      /* hairlines */
  --jade:#3DDC97;      /* primary action */
  --jade-soft:#0F2A20;
  --vermilion:#FF8A70; /* wrong answers */
  --pinyin:#8DB8FF;    /* pinyin reads blue so it stands apart from Amharic */
  --ok:#4ADE80; --bad:#FF8A80;
  --display:"Bricolage Grotesque","Noto Sans Ethiopic",system-ui,sans-serif;
  --body:"Noto Sans Ethiopic","Noto Sans",system-ui,sans-serif;
  --latin:"Noto Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#111111; --ink:#F5F5F5; --muted:#9E9E9E; --line:#2A2A2A;
    --jade:#3DDC97; --jade-soft:#0F2A20; --vermilion:#F08A74; --pinyin:#8DB8FF;
    --ok:#4ADE80; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#111111; --ink:#F5F5F5; --muted:#9E9E9E; --line:#2A2A2A;
  --jade:#3DDC97; --jade-soft:#0F2A20; --vermilion:#F08A74; --pinyin:#8DB8FF;
  --ok:#4ADE80; --bad:#FF8A80; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EDF3EF; --surface:#FFFFFF; --ink:#12231D; --muted:#5C6F66; --line:#D5E1DA;
  --jade:#0E7356; --jade-soft:#D7EEE4; --vermilion:#C2412D; --pinyin:#1B4D8A;
  --ok:#17794A; --bad:#B42C1B; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
/* File picker must stay in the page (not display:none) so phones open it on tap. */
.file-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer}
.file-in{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.py{font-family:var(--latin);color:var(--pinyin);font-weight:700}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

.app{max-width:720px;margin:0 auto;display:grid;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding:16px 0 12px;display:grid;gap:12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.progress{display:grid;gap:6px;justify-items:end;min-width:120px}
.progress span{font-size:.82rem;color:var(--muted)}
.bar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--jade);width:0;border-radius:99px;transition:width .35s}

.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1rem}
.search:focus{outline:2px solid var(--jade);outline-offset:0;border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px}
.emo{width:52px;height:52px;border-radius:16px;background:var(--jade-soft);display:grid;place-items:center;font-size:1.6rem}
.item .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item .py{font-size:1.15rem;overflow-wrap:anywhere}
.item .am{font-weight:700;font-size:1.02rem}
.item .en{color:var(--muted);font-size:.9rem}
.rd{display:inline-block;font-size:.84rem;background:var(--bg);border-radius:8px;padding:1px 8px;margin-top:4px}
.note{font-size:.88rem;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.row-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-size:.88rem;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#000}
.hint-line{font-size:.85rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
.btn.ghost{background:transparent}
.btn.on{color:var(--ok);border-color:var(--ok)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.empty{color:var(--muted);text-align:center;padding:28px 8px}

.stage{display:grid;gap:16px;justify-items:center}
.flash{width:100%;perspective:1000px;background:none;border:0;padding:0;text-align:center}
.flash-inner{display:grid;width:100%;min-height:360px;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);
  border:1px solid var(--line);border-radius:24px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0}
.face.back{transform:rotateY(180deg)}
.face .big{font-size:clamp(2.1rem,10vw,3rem);font-family:var(--latin);color:var(--pinyin);font-weight:700;overflow-wrap:anywhere}
.face .am-big{font-size:1.45rem;font-weight:700}
.face .en-big{color:var(--muted)}
.face .rd-big{background:var(--jade-soft);border-radius:10px;padding:4px 14px;font-size:.98rem}
.face .note-small{font-size:.9rem;color:var(--muted);max-width:46ch}
.ex-small{font-size:.92rem;text-align:left;width:100%;background:var(--bg);border-radius:14px;padding:12px 14px}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;width:100%}
.counter{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:14px;min-width:0}
.qcard .prompt{font-size:1.3rem;font-weight:800}
.opts{display:grid;gap:10px}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;text-align:left;font-family:var(--latin);font-size:1.05rem;font-weight:700;color:var(--pinyin);min-height:50px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--bg));color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg));color:var(--ink)}
.feedback{min-height:1.6em;font-weight:700}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
.score{text-align:center;display:grid;gap:8px;justify-items:center}

.dlg{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;min-width:0}
.dlg h3{margin:0;font-family:var(--display);font-size:1.12rem}
.line{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:start}
.who{width:36px;height:36px;border-radius:50%;background:var(--jade);color:#000;display:grid;place-items:center;font-weight:800}
.line .py{overflow-wrap:anywhere;display:block}
.line .am{display:block;font-weight:600}
.line .en{display:block;color:var(--muted);font-style:italic;font-size:.9rem}

/* edit dialog */
dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:0;width:min(460px,calc(100vw - 32px));max-height:88vh}
dialog::backdrop{background:rgba(5,15,11,.55)}
dialog form{display:grid;gap:12px;padding:20px}
dialog h2{margin:0;font-family:var(--display);font-size:1.3rem}
dialog label{display:grid;gap:5px;font-size:.85rem;font-weight:700;color:var(--muted)}
dialog input,dialog textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem}
dialog textarea{min-height:80px;resize:vertical}
dialog input:focus,dialog textarea:focus{outline:2px solid var(--jade);outline-offset:0;border-color:transparent}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hint{font-size:.82rem;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;padding:9px 2px 10px;font-size:.78rem;font-weight:600;color:var(--muted);display:grid;gap:3px;justify-items:center;min-height:60px}
.tab .ic{font-size:1.25rem;line-height:1}
.tab[aria-selected="true"]{color:var(--jade)}
.tab[aria-selected="true"] .ic{transform:translateY(-1px)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:9;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){.flash-inner,.bar>i{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">🇨🇳 Learn Chinese<small>Amharic · ቻይንኛን በአማርኛ</small></div>
      <div class="progress" aria-live="polite">
        <span id="learned-text" class="tnum">0 / 150</span>
        <div class="bar" aria-hidden="true"><i id="learned-bar"></i></div>
      </div>
    </div>
  </header>

  <main>
    <section id="view-words" aria-label="ቃላት" style="display:grid;gap:12px">
      <input class="search" id="search" type="search" placeholder="ቃል ፈልግ (Pinyin ወይም አማርኛ)" aria-label="ቃል ፈልግ">
      <div class="chips" id="chips-words" role="group" aria-label="ምዕራፍ ምረጥ"></div>
      <div class="hint-line">🎙 የራስህን ድምጽ ለመጨመር «የኔ ድምጽ» ን ተጫን እና የተቀዳ ፋይል ምረጥ። ድምጽ ካልጨመርክ የመሣሪያው ድምጽ ይነበባል።</div>
      <ul class="list" id="list"></ul>
    </section>

    <section id="view-cards" aria-label="ካርድ" hidden style="display:grid;gap:12px">
      <div class="chips" id="chips-cards" role="group" aria-label="ምዕራፍ ምረጥ"></div>
      <div class="stage">
        <button class="flash" id="flash" type="button" aria-label="ካርዱን ገልብጥ"><div class="flash-inner" id="flash-inner"></div></button>
        <div class="controls">
          <button class="btn" id="btn-no" type="button">አላውቅም</button>
          <button class="btn ghost" id="btn-listen" type="button">▶ ስማ</button>
          <button class="btn primary" id="btn-yes" type="button">አውቃለሁ</button>
        </div>
        <div class="counter" id="card-count"></div>
      </div>
    </section>

    <section id="view-quiz" aria-label="ጥያቄ" hidden style="display:grid;gap:12px">
      <div class="chips" id="chips-quiz" role="group" aria-label="ምዕራፍ ምረጥ"></div>
      <div id="quiz-body"></div>
    </section>

    <section id="view-dialogue" aria-label="ውይይት" hidden style="display:grid;gap:12px">
      <div class="chips" id="chips-dlg" role="group" aria-label="ምዕራፍ ምረጥ"></div>
      <div id="dlg-body" style="display:grid;gap:14px"></div>
    </section>
  </main>
  <footer style="text-align:center;color:var(--muted);font-size:.78rem;padding:8px 0 4px">Learn Chinese Amharic · HSK1 Practice</footer>
</div>

<nav class="tabs" role="tablist" aria-label="ዋና ምናሌ">
  <button class="tab" role="tab" data-tab="words" aria-selected="true"><span class="ic">📚</span>ቃላት</button>
  <button class="tab" role="tab" data-tab="cards" aria-selected="false"><span class="ic">🃏</span>ካርድ</button>
  <button class="tab" role="tab" data-tab="quiz" aria-selected="false"><span class="ic">✅</span>ጥያቄ</button>
  <button class="tab" role="tab" data-tab="dialogue" aria-selected="false"><span class="ic">💬</span>ውይይት</button>
</nav>

<dialog id="edit-dialog" aria-labelledby="edit-title">
  <form id="edit-form" method="dialog">
    <h2 id="edit-title">ቃሉን አርም</h2>
    <input type="hidden" id="f-no">
    <label>Pinyin<input id="f-py" required autocomplete="off"></label>
    <label>አማርኛ ትርጉም<input id="f-am" required></label>
    <label>English meaning<input id="f-en" required></label>
    <label>አማርኛ አነባበብ<input id="f-rd" required></label>
    <label>ምልክት (emoji)<input id="f-emo" maxlength="8"></label>
    <label>ማስታወሻ<textarea id="f-note"></textarea></label>
    <p class="hint">ለውጦቹ በዚህ መሣሪያ ላይ ይቀመጣሉ።</p>
    <div class="form-actions">
      <button class="btn danger" type="button" id="f-reset">ወደ መጀመሪያው መልስ</button>
      <button class="btn" type="button" id="f-cancel">ሰርዝ</button>
      <button class="btn primary" type="submit" id="f-save">አስቀምጥ</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

  function chipRow(el, state, onPick){
    el.innerHTML = '';
    DATA.length && ['ሁሉም'].concat(DATA.map(function(c){ return 'ም ' + c.n; })).forEach(function(lab, idx){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = lab;
      b.setAttribute('aria-pressed', String(state.ch === idx));
      b.addEventListener('click', function(){ onPick(idx); });
      el.appendChild(b);
    });
  }

  // ---- tabs ----
  function showTab(name){
    ['words','cards','quiz','dialogue'].forEach(function(t){ document.getElementById('view-' + t).hidden = (t !== name); });
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === name)); });
    if (name === 'words') renderWords();
    if (name === 'cards') renderCard();
    if (name === 'quiz') renderQuizStart();
    if (name === 'dialogue') renderDialogue();
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }
  document.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ showTab(b.getAttribute('data-tab')); }); });

  // ---- own voice clips (per viewer, IndexedDB; every access guarded) ----
  var hasOwnAudio = {}, urlCache = {};
  var AUDIO_ACCEPT = 'audio/*,.m4a,.mp3,.wav,.ogg,.aac,.amr,.3gp,.opus,.flac';
  function openDb(){
    return new Promise(function(res, rej){
      try {
        var r = indexedDB.open('hsk1-audio', 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore('clips'); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      } catch(e){ rej(e); }
    });
  }
  function clipOp(mode, fn){
    return openDb().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction('clips', mode), req = fn(tx.objectStore('clips'));
        tx.oncomplete = function(){ res(req ? req.result : undefined); };
        tx.onerror = tx.onabort = function(){ rej(tx.error); };
      });
    });
  }
  function forgetUrl(no){ if (urlCache[no]) { try { URL.revokeObjectURL(urlCache[no]); } catch(e){} delete urlCache[no]; } }
  function refreshClips(){
    return clipOp('readonly', function(s){ return s.getAllKeys(); }).then(function(keys){
      hasOwnAudio = {}; (keys || []).forEach(function(k){ hasOwnAudio[k] = true; }); renderWords();
    }).catch(function(){});
  }
  function playWord(w){
    if (!hasOwnAudio[w.no]) return speak(w.py);
    clipOp('readonly', function(s){ return s.get(w.no); }).then(function(blob){
      if (!blob) return speak(w.py);
      if (!urlCache[w.no]) urlCache[w.no] = URL.createObjectURL(blob);
      var a = new Audio(urlCache[w.no]);
      a.play().catch(function(){ speak(w.py); });
    }).catch(function(){ speak(w.py); });
  }
  document.getElementById('list').addEventListener('change', function(e){
    if (!e.target.matches('input[data-audio]')) return;
    var no = Number(e.target.getAttribute('data-audio'));
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var isAudio = /^audio\//.test(file.type || '') || /\.(m4a|mp3|wav|ogg|aac|amr|3gp|opus|flac)$/i.test(file.name || '');
    if (!isAudio) return toast('የድምጽ ፋይል ብቻ ምረጥ');
    if (file.size > 8 * 1024 * 1024) return toast('ፋይሉ ከ8 MB መብለጥ የለበትም');
    clipOp('readwrite', function(s){ return s.put(file, no); }).then(function(){
      forgetUrl(no); hasOwnAudio[no] = true; renderWords(); toast('ድምጽህ ተቀምጧል');
    }).catch(function(err){ toast('ማስቀመጥ አልተቻለም: ' + ((err && err.name) || 'error')); });
  });

  // ---- words + edit ----
  var wState = { ch: 0, q: '' };
  function renderWords(){
    chipRow(document.getElementById('chips-words'), wState, function(i){ wState.ch = i; renderWords(); });
    var q = wState.q.trim().toLowerCase();
    var rows = WORDS.filter(function(w){
      if (!inChapter(w, wState.ch)) return false;
      if (!q) return true;
      return (w.py + ' ' + w.am + ' ' + w.en + ' ' + w.rd).toLowerCase().indexOf(q) !== -1;
    });
    var list = document.getElementById('list');
    list.innerHTML = rows.length ? '' : '<li class="empty">ምንም ቃል አልተገኘም።</li>';
    rows.forEach(function(w){
      var li = document.createElement('li'); li.className = 'item';
      li.innerHTML =
        '<div class="emo" aria-hidden="true">' + esc(w.emo) + '</div>' +
        '<div style="min-width:0">' +
          '<div class="head"><div class="py">' + esc(w.py) + '</div><span class="muted tnum" style="font-size:.8rem">#' + w.no + '</span></div>' +
          '<div class="am">' + esc(w.am) + '</div>' +
          '<div class="en">' + esc(w.en) + '</div>' +
          '<span class="rd">አነባበብ: ' + esc(w.rd) + '</span>' +
          '<div class="note">' + esc(w.note) + '</div>' +
          '<div class="row-actions">' +
            '<button class="btn" type="button" data-play="' + w.no + '">▶ ስማ</button>' +
            '<label class="btn file-btn ' + (hasOwnAudio[w.no] ? 'on' : '') + '">🎙 የኔ ድምጽ<input type="file" class="file-in" data-audio="' + w.no + '" accept="' + AUDIO_ACCEPT + '"></label>' +
            (hasOwnAudio[w.no] ? '<button class="btn danger" type="button" data-del="' + w.no + '" aria-label="ድምጽ ሰርዝ">🗑</button>' : '') +
            '<button class="btn ' + (isLearned(w) ? 'on' : '') + '" type="button" data-learn="' + w.no + '">' + (isLearned(w) ? '✓ ተምሬዋለሁ' : 'ተምሬዋለሁ') + '</button>' +
            '<button class="btn ghost" type="button" data-edit="' + w.no + '">✎ አርም</button>' +
          '</div>' +
        '</div>';
      list.appendChild(li);
    });
    updateProgress();
  }
  document.getElementById('search').addEventListener('input', function(e){ wState.q = e.target.value; renderWords(); });
  document.getElementById('list').addEventListener('click', function(e){
    var p = e.target.closest('[data-play]');
    if (p) return playWord(WORDS[Number(p.getAttribute('data-play')) - 1]);
    var up = e.target.closest('[data-up]');
    if (up){ uploadNo = Number(up.getAttribute('data-up')); return document.getElementById('audio-file').click(); }
    var dl = e.target.closest('[data-del]');
    if (dl){
      var dn = Number(dl.getAttribute('data-del'));
      return clipOp('readwrite', function(s){ return s.delete(dn); }).then(function(){
        forgetUrl(dn); hasOwnAudio[dn] = false; renderWords(); toast('ድምጽ ተሰርዟል');
      }).catch(function(){ toast('መሰረዝ አልተቻለም'); });
    }
    var l = e.target.closest('[data-learn]');
    if (l){ var w = WORDS[Number(l.getAttribute('data-learn')) - 1]; setLearned(w, !isLearned(w)); return renderWords(); }
    var ed = e.target.closest('[data-edit]');
    if (ed) openEdit(WORDS[Number(ed.getAttribute('data-edit')) - 1]);
  });

  var dlg = document.getElementById('edit-dialog');
  function openEdit(w){
    document.getElementById('edit-title').textContent = '#' + w.no + ' · ቃሉን አርም';
    document.getElementById('f-no').value = w.no;
    document.getElementById('f-py').value = w.py;
    document.getElementById('f-am').value = w.am;
    document.getElementById('f-en').value = w.en;
    document.getElementById('f-rd').value = w.rd;
    document.getElementById('f-emo').value = w.emo;
    document.getElementById('f-note').value = w.note;
    document.getElementById('f-reset').hidden = !edits[w.no];
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    document.getElementById('f-py').focus();
  }
  function closeEdit(){ if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
  document.getElementById('f-cancel').addEventListener('click', closeEdit);
  document.getElementById('f-reset').addEventListener('click', function(){
    var no = Number(document.getElementById('f-no').value);
    delete edits[no]; save('hsk1-edits', edits);
    applyAll(no); closeEdit(); renderWords(); toast('ወደ መጀመሪያው ተመልሷል');
  });
  document.getElementById('edit-form').addEventListener('submit', function(e){
    e.preventDefault();
    var no = Number(document.getElementById('f-no').value);
    var v = {
      py: document.getElementById('f-py').value.trim(),
      am: document.getElementById('f-am').value.trim(),
      en: document.getElementById('f-en').value.trim(),
      rd: document.getElementById('f-rd').value.trim(),
      emo: document.getElementById('f-emo').value.trim() || '•',
      note: document.getElementById('f-note').value.trim()
    };
    if (!v.py || !v.am || !v.en || !v.rd) return toast('ፒኒን፣ አማርኛ፣ እንግሊዝኛ እና አነባበብ ባዶ መሆን የለባቸውም');
    edits[no] = v; save('hsk1-edits', edits);
    applyAll(no); closeEdit(); renderWords(); toast('ተቀምጧል');
  });
  function applyAll(no){
    var w = WORDS[no - 1], orig = ORIG[no - 1];
    ['py','am','en','rd','emo','note'].forEach(function(k){ w[k] = orig[k]; });
    var e = edits[no];
    if (e) ['py','am','en','rd','emo','note'].forEach(function(k){ if (typeof e[k] === 'string') w[k] = e[k]; });
    w.edited = !!e;
  }
  var ORIG = WORDS.map(function(w){ return { py: w.py, am: w.am, en: w.en, rd: w.rd, emo: w.emo, note: w.note }; });
  dlg.addEventListener('click', function(e){ if (e.target === dlg) closeEdit(); });

  // ---- flashcards ----
  var cState = { ch: 0, deck: [], i: 0, known: 0, unknown: 0 };
  function buildDeck(){ cState.deck = WORDS.filter(function(w){ return inChapter(w, cState.ch); }); cState.i = 0; cState.known = 0; cState.unknown = 0; }
  function renderCard(){
    chipRow(document.getElementById('chips-cards'), cState, function(i){ cState.ch = i; buildDeck(); renderCard(); });
    var flash = document.getElementById('flash'), inner = document.getElementById('flash-inner');
    var countEl = document.getElementById('card-count');
    if (!cState.deck.length) buildDeck();
    if (cState.i >= cState.deck.length){
      inner.innerHTML = '<div class="face"><div class="am-big">ጨርሰሃል! 🎉</div>' +
        '<div class="en-big">አውቃለሁ: ' + cState.known + ' · አላውቅም: ' + cState.unknown + '</div>' +
        '<button class="btn primary" type="button" id="again">እንደገና</button></div>';
      flash.classList.remove('flipped'); countEl.textContent = 'ተጠናቋል';
      document.getElementById('again').addEventListener('click', function(){ buildDeck(); renderCard(); });
      return;
    }
    var w = cState.deck[cState.i];
    countEl.textContent = (cState.i + 1) + ' / ' + cState.deck.length;
    inner.innerHTML =
      '<div class="face"><div style="font-size:2.6rem" aria-hidden="true">' + esc(w.emo) + '</div>' +
      '<div class="big">' + esc(w.py) + '</div><div class="muted">ገልብጥ ለትርጉም</div></div>' +
      '<div class="face back"><div class="am-big">' + esc(w.am) + '</div>' +
      '<div class="en-big">' + esc(w.en) + '</div>' +
      '<div class="rd-big">አነባበብ: ' + esc(w.rd) + '</div>' +
      '<div class="note-small">' + esc(w.note) + '</div>' +
      '<div class="ex-small"><span class="py">' + esc(w.ex[0].py) + '</span><br>' + esc(w.ex[0].am) + '<br><span class="muted">' + esc(w.ex[0].en) + '</span></div></div>';
    flash.classList.remove('flipped');
  }
  document.getElementById('flash').addEventListener('click', function(){
    if (cState.i < cState.deck.length) this.classList.toggle('flipped');
  });
  function next(known){
    if (cState.i >= cState.deck.length) return;
    var w = cState.deck[cState.i];
    if (known){ cState.known++; setLearned(w, true); } else { cState.unknown++; }
    cState.i++; renderCard();
  }
  document.getElementById('btn-yes').addEventListener('click', function(){ next(true); });
  document.getElementById('btn-no').addEventListener('click', function(){ next(false); });
  document.getElementById('btn-listen').addEventListener('click', function(){
    if (cState.i < cState.deck.length) playWord(cState.deck[cState.i]);
  });

  // ---- quiz ----
  var qState = { ch: 0, items: [], i: 0, score: 0, done: false };
  function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function startQuiz(){
    var pool = WORDS.filter(function(w){ return inChapter(w, qState.ch); });
    qState.items = shuffle(pool).slice(0, Math.min(10, pool.length)).map(function(w){
      var d = shuffle(WORDS.filter(function(x){ return x.py !== w.py; })).slice(0, 3).map(function(x){ return x.py; });
      return { w: w, opts: shuffle([w.py].concat(d)) };
    });
    qState.i = 0; qState.score = 0; qState.done = false;
    renderQuiz();
  }
  function renderQuizStart(){
    chipRow(document.getElementById('chips-quiz'), qState, function(i){ qState.ch = i; startQuiz(); });
    if (!qState.items.length) startQuiz(); else renderQuiz();
  }
  function renderQuiz(){
    var body = document.getElementById('quiz-body');
    if (!qState.items.length){ body.innerHTML = '<p class="empty">ጥያቄ የለም።</p>'; return; }
    if (qState.done){
      body.innerHTML = '<div class="qcard score"><div class="prompt">ውጤትህ ' + qState.score + ' / ' + qState.items.length + '</div>' +
        '<div class="muted">' + (qState.score === qState.items.length ? 'በጣም ጥሩ! ሁሉንም አግኝተሃል።' : 'ቀጥል፤ ድጋሚ ሞክር።') + '</div>' +
        '<button class="btn primary" type="button" id="quiz-again">አዲስ ጥያቄ</button></div>';
      document.getElementById('quiz-again').addEventListener('click', startQuiz);
      return;
    }
    var it = qState.items[qState.i];
    body.innerHTML =
      '<div class="qcard"><div class="counter">ጥያቄ ' + (qState.i + 1) + ' / ' + qState.items.length + '</div>' +
      '<div class="prompt">' + esc(it.w.am) + '</div><div class="muted">' + esc(it.w.en) + '</div>' +
      '<div class="opts" id="opts">' + it.opts.map(function(o, k){ return '<button class="opt" type="button" data-k="' + k + '">' + esc(o) + '</button>'; }).join('') + '</div>' +
      '<div class="feedback" id="fb" aria-live="polite"></div>' +
      '<div><button class="btn primary" type="button" id="quiz-next" disabled>ቀጣይ</button></div></div>';
    document.getElementById('opts').addEventListener('click', function(e){
      var b = e.target.closest('.opt'); if (!b || b.disabled) return;
      var chosen = it.opts[Number(b.getAttribute('data-k'))];
      document.querySelectorAll('#opts .opt').forEach(function(x){ x.disabled = true; if (x.textContent === it.w.py) x.classList.add('right'); });
      var fb = document.getElementById('fb');
      if (chosen === it.w.py){ qState.score++; b.classList.add('right'); fb.textContent = 'ትክክል ነው!'; fb.className = 'feedback ok'; }
      else { b.classList.add('wrong'); fb.textContent = 'ትክክለኛው: ' + it.w.py; fb.className = 'feedback no'; }
      speak(it.w.py);
      document.getElementById('quiz-next').disabled = false;
    });
    document.getElementById('quiz-next').addEventListener('click', function(){
      qState.i++; if (qState.i >= qState.items.length) qState.done = true; renderQuiz();
    });
  }

  // ---- dialogues ----
  var dState = { ch: 0 };
  function renderDialogue(){
    chipRow(document.getElementById('chips-dlg'), dState, function(i){ dState.ch = i; renderDialogue(); });
    var body = document.getElementById('dlg-body'); body.innerHTML = '';
    DATA.filter(function(c){ return dState.ch === 0 || c.n === dState.ch; }).forEach(function(c){
      c.dialogues.forEach(function(d){
        var box = document.createElement('div'); box.className = 'dlg';
        box.innerHTML = '<h3>' + esc(c.title) + ' · ' + esc(d.title) + '</h3>' + d.lines.map(function(l){
          return '<div class="line"><div class="who">' + esc(l.who) + '</div>' +
            '<div style="min-width:0"><span class="py">' + esc(l.py) + '</span><span class="am">' + esc(l.am) + '</span><span class="en">' + esc(l.en) + '</span></div>' +
            '<button class="btn ghost" type="button" data-speak="' + esc(l.py) + '" aria-label="ስማ">▶</button></div>';
        }).join('');
        body.appendChild(box);
      });
    });
    if (!body.children.length) body.innerHTML = '<p class="empty">ውይይት የለም።</p>';
  }
  document.getElementById('dlg-body').addEventListener('click', function(e){
    var s = e.target.closest('[data-speak]'); if (s) speak(s.getAttribute('data-speak'));
  });

  updateProgress();
  renderWords();
  buildDeck();
  refreshClips();
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body></html>
